manifestVersion: 1
id: sam-prusa-connect
storage:
  dataRoot: data
category: automation
name: Prusa Connect
version: "0.1.0-beta.1"
tagline: Run Prusa Connect for your 3D printers on your own Umbrel
icon: https://raw.githubusercontent.com/sam-apostel/umbrel-app-store/main/sam-prusa-connect/icon.svg
description: >-
  Prusa Connect is Prusa Research's server for 3D printers, which you run yourself. Your printers
  connect to your Umbrel over your own network, not to the cloud, and accounts, printers, print
  history and print files stay on your Umbrel.


  Use it to see every printer's state, temperatures and progress live, send G-code to a printer
  and start, pause, resume or stop a print, and give each person only the printers and actions you
  choose. Other programs can use its REST API, live events, MQTT and webhooks.


  First run: open the app and enter the password umbrelOS shows for this app as the setup code.
  Then create your own administrator account in the setup wizard. Keep the folder for uploads at
  /storage, the wizard's default, so your print files survive updates.


  To add a printer, open the app by your Umbrel's IP address (for example
  http://192.168.1.20:8580), not umbrel.local, and use "Add a printer". The settings file it
  offers for the printer's USB drive then holds an address the printer can reach.


  Prusa Connect is in public beta: back up before you update. Built from the unmodified source of
  Prusa Connect by Prusa Research, under its Open Community Licence (non-commercial, and for
  businesses up to EUR 1M yearly revenue for their own internal use).
releaseNotes: "Prusa Connect 0.1.0-beta.1\n\nPrusa Connect is a server you run on your own network. Your printers connect to it, and you use them from its web app and its API. Nothing goes through a cloud service.\n\nWhich file to download\n\n| your machine | file |\n|---|---|\n| a Linux PC or NAS, 64-bit Intel or AMD | prusa_connect_amd64 |\n| a Raspberry Pi Zero 2 W, 3, 4 or 5 with a 64-bit system, or another 64-bit ARM Linux machine | prusa_connect_aarch64 |\n| a Raspberry Pi 2, Zero 2 W, 3, 4 or 5 with a 32-bit system | prusa_connect_armv7 |\n| a Raspberry Pi Zero, Zero W or 1 | prusa_connect_armhf |\n| Windows on Intel or AMD | prusa_connect_windows_amd64.exe |\n| Windows on ARM | prusa_connect_windows_arm64.exe |\n| a Mac with an Intel processor | prusa_connect_macos_amd64 |\n| a Mac with Apple silicon (M1 and later) | prusa_connect_macos_arm64 |\n\nThese are the full build. Each one carries the web app, the HTTP API, the live event stream, MQTT, SQLite and PostgreSQL storage, and Prometheus metrics. MQTT, the metrics and PostgreSQL stay off until the configuration file turns them on.\n\nThe prusa_connect_minimal_* files are a smaller Linux build for the same four processors. It has the API and the printer connection, and it has no web app, no MQTT, no metrics and no PostgreSQL.\n\nWhat changed\n\nSecurity\n- Go 1.26.11 now builds the server and every container image, and it fixes GO-2026-6859 in net/http. Building from source needs Go 1.26.11\n\nChanged\n...\n\nFull release notes: https://github.com/prusa3d/prusa-connect/releases/tag/v0.1.0-beta.1"

